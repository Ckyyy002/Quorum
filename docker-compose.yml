# Local infrastructure only. Credentials are dev defaults; never reuse them outside localhost.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
      POSTGRES_DB: quorum
    ports:
      # 5434 on the host: 5432 is often taken by another local Postgres.
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quorum']
      interval: 5s
      timeout: 3s
      retries: 10

  # Separate database for e2e tests; tmpfs keeps it fast and empty on every restart.
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
      POSTGRES_DB: quorum_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quorum']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
volumes:
  pgdata:
